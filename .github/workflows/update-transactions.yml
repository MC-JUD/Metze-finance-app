name: Update Pennylane Transactions

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-transactions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch transactions from Pennylane
        run: |
          python3 << 'PYEOF'
          import urllib.request, urllib.parse, json, os
          from datetime import datetime

          token = os.environ['PENNYLANE_TOKEN']
          all_items = []
          cursor = None
          page = 1

          while page <= 20:
              print(f"Fetching page {page}...")

              params = {
                  'sort': '-id',
                  'page_size': '100',
                  'min_date': '2026-01-01',
                  'max_date': '2026-12-31'
              }
              if cursor:
                  params['cursor'] = cursor

              url = 'https://app.pennylane.com/api/external/v2/transactions?' + urllib.parse.urlencode(params)

              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json'
              })

              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode())
              except Exception as e:
                  print(f"Error on page {page}: {e}")
                  break

              items = data.get('items', [])
              has_more = data.get('has_more', False)
              cursor = data.get('next_cursor', None)

              print(f"Page {page}: {len(items)} transactions, has_more={has_more}")
              all_items.extend(items)

              if not has_more or not cursor:
                  break

              page += 1

          print(f"Total: {len(all_items)} transactions fetched")

          output = {
              'items': all_items,
              'updated_at': datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
              'total': len(all_items),
              'source': 'Pennylane API via GitHub Actions'
          }

          os.makedirs('public', exist_ok=True)
          with open('public/transactions.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Done! File written with {len(all_items)} transactions.")
          PYEOF
        env:
          PENNYLANE_TOKEN: ${{ secrets.PENNYLANE_TOKEN }}

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/transactions.json
          git diff --staged --quiet || git commit -m "Auto-update transactions Pennylane 2026 - $(date -u +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
