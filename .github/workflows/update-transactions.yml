name: Update Pennylane Transactions

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: update-transactions
  cancel-in-progress: false

jobs:
  update-transactions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Fetch transactions from Pennylane
        run: |
          python3 << 'PYEOF'
          import urllib.request, urllib.parse, json, os
          from datetime import datetime

          token = os.environ['PENNYLANE_TOKEN']
          all_items = []

          # Récupérer mois par mois pour contourner la limite de pagination Pennylane
          months = [
              ('2026-01-01', '2026-01-31'),
              ('2026-02-01', '2026-02-28'),
              ('2026-03-01', '2026-03-31'),
              ('2026-04-01', '2026-04-30'),
              ('2026-05-01', '2026-05-31'),
              ('2026-06-01', '2026-06-30'),
              ('2026-07-01', '2026-07-31'),
              ('2026-08-01', '2026-08-31'),
              ('2026-09-01', '2026-09-30'),
              ('2026-10-01', '2026-10-31'),
              ('2026-11-01', '2026-11-30'),
              ('2026-12-01', '2026-12-31'),
          ]

          for min_date, max_date in months:
              print(f"\n--- Fetching {min_date[:7]} ---")
              cursor = None
              page = 1
              month_items = []

              while page <= 20:
                  params = {
                      'sort': '-date',
                      'page_size': '100',
                      'min_date': min_date,
                      'max_date': max_date
                  }
                  if cursor:
                      params['cursor'] = cursor

                  url = 'https://app.pennylane.com/api/external/v2/transactions?' + urllib.parse.urlencode(params)
                  req = urllib.request.Request(url, headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json'
                  })

                  try:
                      with urllib.request.urlopen(req) as resp:
                          data = json.loads(resp.read().decode())
                  except Exception as e:
                      print(f"Error on page {page}: {e}")
                      break

                  items = data.get('items', [])
                  has_more = data.get('has_more', False)
                  cursor = data.get('next_cursor', None)

                  print(f"  Page {page}: {len(items)} transactions, has_more={has_more}")
                  month_items.extend(items)

                  if not has_more or not cursor:
                      break

                  page += 1

              print(f"  Total {min_date[:7]}: {len(month_items)} transactions")
              all_items.extend(month_items)

          print(f"\nTotal global: {len(all_items)} transactions fetched")

          # Trier par date décroissante puis ID décroissant
          all_items.sort(key=lambda x: (x.get('date', ''), x.get('id', 0)), reverse=True)

          output = {
              'items': all_items,
              'updated_at': datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
              'total': len(all_items),
              'source': 'Pennylane API via GitHub Actions'
          }

          os.makedirs('public', exist_ok=True)
          with open('public/transactions.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Done! File written with {len(all_items)} transactions.")
          PYEOF
        env:
          PENNYLANE_TOKEN: ${{ secrets.PENNYLANE_TOKEN }}

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          cp public/transactions.json /tmp/transactions_new.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/transactions_new.json public/transactions.json
          git add public/transactions.json
          git diff --staged --quiet || git commit -m "Auto-update transactions Pennylane 2026 - $(date -u +%Y-%m-%d)"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/MC-JUD/Metze-finance-app.git
          git push origin main
